<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>LG Video 播放器</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
    </style>
    <link rel="stylesheet" href="assets/css/player.css">
    <link rel="stylesheet" href="assets/css/toastify.min.css">
</head>

<body>
    <!-- 播放器独立窗口形态（DOM 结构与叠层一致，player.js 双端共用） -->
    <div id="player-window-root">
        <div class="player-topbar">
            <div class="player-title" id="player-title"></div>
            <button id="player-close" class="window-control-button" data-tooltip="关闭">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <video id="player-video" playsinline></video>
        <div id="player-error" class="hidden"></div>
        <div id="player-episodes" class="player-episodes" hidden></div>
        <div id="player-controls">
            <div class="pc-progress" id="pc-progress">
                <div class="pc-buffer" id="pc-buffer"></div>
                <div class="pc-segment" id="pc-segment"></div>
                <div class="pc-thumb" id="pc-thumb"></div>
                <div class="pc-hover-time" id="pc-hover-time"></div>
            </div>
            <div class="pc-row">
                <button class="pc-btn" id="pc-ep-prev" data-tip="上一集">⏮</button>
                <button class="pc-btn" id="pc-back10" data-tip="后退 10 秒 (J)">-10s</button>
                <button class="pc-btn big" id="pc-play">▶</button>
                <button class="pc-btn" id="pc-fwd10" data-tip="前进 10 秒 (L)">+10s</button>
                <button class="pc-btn" id="pc-ep-next" data-tip="下一集">⏭</button>
                <span class="pc-time"><span id="pc-cur">0:00</span> / <span id="pc-dur">0:00</span></span>
                <div class="pc-spacer"></div>
                <button class="pc-btn" id="pc-ab" data-tip="A-B 循环">A-B</button>
                <button class="pc-btn" id="pc-aspect" data-tip="画面比例">⧉</button>
                <select id="pc-rate" class="pc-select" data-tip="倍速">
                    <option value="0.25">0.25x</option>
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="1.75">1.75x</option>
                    <option value="2">2.0x</option>
                    <option value="2.25">2.25x</option>
                    <option value="2.5">2.5x</option>
                    <option value="2.75">2.75x</option>
                    <option value="3">3.0x</option>
                </select>
                <button class="pc-btn" id="pc-shot" data-tip="截图 (S)">📷</button>
                <div class="pc-vol">
                    <button class="pc-btn" id="pc-mute">🔊</button>
                    <input type="range" id="pc-volume" min="0" max="1" step="0.02" value="1" class="pc-volume">
                </div>
                <button class="pc-btn" id="pc-fullscreen" data-tip="全屏 (F)">⛶</button>
            </div>
        </div>
    </div>
    <script src="./assets/js/toastify.min.js"></script>
    <script src="./assets/js/player.js"></script>
</body>

</html>
